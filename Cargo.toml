[package]
name = "yt-music-tui"
version = "0.1.0"
description = "Terminal UI for managing your YouTube Music library: import, export, sort and dedupe playlists"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
futures = "0.3.34"
ratatui = "0.30.2"
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["full"] }
unicode-bidi = "0.3.18"
ytmapi-rs = "0.3.3"
